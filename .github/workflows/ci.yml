name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The queue tests each entry on top of the ones ahead of it, so a push to
  # main has already passed and runs nothing.
  merge_group:
  # A merge_group run saves its cache on its queue branch, which no pull
  # request can restore from, so the daily refresh job dispatches this
  # workflow on main, whose run saves the cache pull requests restore from.
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:
permissions:
  contents: read
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
jobs:
  refresh:
    if: github.event_name == 'schedule'
    # One API call: a GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Dispatch CI on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow_ref }}
        run: |
          workflow=${WORKFLOW%@*}
          gh workflow run "${workflow##*/}" --repo "$REPOSITORY" --ref main
  verify:
    if: ${{ !github.event.pull_request.draft && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: mise install --locked
      - run: bun install --frozen-lockfile
      - run: mise run build
      - run: mise run verify
