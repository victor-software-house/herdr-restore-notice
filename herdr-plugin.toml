id = "vsh.restore-notice"
name = "Restore Notice"
version = "0.0.0"
min_herdr_version = "0.8.2"
description = "Compact restore notices with clickable Resume, Transcript and Directory links. Agents start only on an explicit Resume request."
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/install.sh"]

[[startup]]
command = ["./bin/restore-notice"]

[[events]]
on = "pane.agent_detected"
command = ["./bin/restore-notice"]

[[actions]]
id = "resume"
title = "Resume retained session"
contexts = ["pane"]
command = ["./bin/restore-notice", "resume"]

[[actions]]
id = "notice"
title = "Show Resume notices"
description = "Print the restore notice in every paused pane that has none yet, such as panes a Stash restore left paused, and keep the launch flags the caller hands over."
contexts = ["workspace"]
command = ["./bin/restore-notice", "notice"]

[[actions]]
id = "list"
title = "List retained sessions"
contexts = ["workspace"]
command = ["./bin/restore-notice", "list"]

[[link_handlers]]
id = "resume"
title = "Resume retained session"
pattern = '^herdr-resume://[a-f0-9]{64}$'
action = "resume"
